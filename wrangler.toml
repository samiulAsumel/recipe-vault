name = "world-kitchen-atlas-proxy"
main = "worker/index.ts"
compatibility_date = "2026-07-28"

# Visit counters (Section 10) — no cookies/personal data. Create with:
#   wrangler kv namespace create ANALYTICS
# then replace the placeholder id below with the one it prints. wrangler dev's
# local mode simulates KV automatically, so the placeholder is fine for local
# testing before this namespace actually exists in Cloudflare.
[[kv_namespaces]]
binding = "ANALYTICS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
